short_bio_text_justify: false
short_bio: >-
    <p> I'm currently working between PKU and UCL, where I explore the exciting field of 
    <strong>brain-inspired computing</strong> 🧠🤖 — from neural coding and perception to neuromorphic systems and high-speed sensing.
    I'm particularly interested in building intelligent systems that take inspiration from how the brain sees and acts. </p>
  
    <p> I've led several projects related to 
    <strong>neuromorphic cameras</strong> and <strong> spike-based visual computing </strong> 🎥⚡️.
    I'm very lucky to be mentored by 
    <a href="https://scholar.google.com/citations?user=knvEK4AAAAAJ&hl=zh-CN&oi=ao" target="_blank">Prof. Tiejun Huang</a> and 
    <a href="https://scholar.google.com/citations?user=q_4u0aoAAAAJ&hl=zh-CN&oi=ao" target="_blank">Prof. Karl Friston</a>, 
    whose guidance continues to shape my thinking💡. 
    </p>
  
    <p>
    I also serve as an Area Chair for <em>CVPR 2026</em> and as a reviewer for leading conferences and journals including 
    <em>Nature Human Behaviour, TIP, TNNLS, CVPR, ICCV, ECCV, NeurIPS, ICML,</em> and <em>ICLR</em>.  
    I am always open to discussing and collaborating on related topics — feel free to reach out if you're working in this space. 🤝
    </p>

